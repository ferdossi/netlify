<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recherche X dynamique</title>

  <link
    rel="icon"
    type="image/svg+xml"
    href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="21.33" y="0" fill="%23239f40"/><rect width="64" height="21.33" y="21.33" fill="%23ffffff"/><rect width="64" height="21.34" y="42.66" fill="%23da0000"/><circle cx="32" cy="32" r="5" fill="%23da0000"/></svg>'
  />

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      background: #f5f5f5;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 14px;
      font-weight: bold;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      font-size: 16px;
      box-sizing: border-box;
    }

    .selector-box {
      margin-top: 8px;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 14px;
      background: #fafafa;
    }

    .selector-title {
      margin-bottom: 10px;
      font-size: 14px;
      color: #555;
    }

    .option-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .option-btn {
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 999px;
      background: white;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s ease;
    }

    .option-btn:hover {
      background: #f0f0f0;
    }

    .option-btn.active {
      background: #000;
      color: white;
      border-color: #000;
    }

    .clear-btn {
      color: #b00020;
      border-color: #e0b4bc;
    }

    .clear-btn:hover {
      background: #fff3f5;
    }

    .hint {
      margin-top: 8px;
      font-size: 13px;
      color: #777;
    }

    .date-wrapper {
      position: relative;
      margin-top: 6px;
    }

    .date-display {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      box-sizing: border-box;
      border: 1px solid #777;
      background: white;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .date-display:hover {
      background: #fafafa;
    }

    .hidden-date-input {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .date-fr {
      margin-top: 8px;
      font-size: 14px;
      color: #444;
      font-style: italic;
    }

    .checkbox-line {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
      font-weight: bold;
    }

    .checkbox-line input {
      width: auto;
      margin: 0;
    }

    .main-button {
      margin-top: 18px;
      padding: 12px 18px;
      font-size: 16px;
      cursor: pointer;
      background: #000;
      color: white;
      border: none;
      border-radius: 8px;
    }

    .main-button:hover {
      background: #333;
    }

    .link-preview {
      margin-top: 16px;
      font-size: 14px;
      color: #555;
      line-height: 1.5;
    }

    .link-preview .url {
      margin-top: 8px;
      word-break: break-all;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Recherche X dynamique</h1>

    <label for="keyword">Mot-clé</label>
    <input id="keyword" type="text" value="iran" />

    <label>Nombre minimum de réponses</label>
    <div class="selector-box">
      <div class="selector-title">Choisir une valeur</div>
      <div class="option-buttons">
        <button type="button" class="option-btn" data-type="replies" data-value="5">5</button>
        <button type="button" class="option-btn" data-type="replies" data-value="15">15</button>
        <button type="button" class="option-btn active" data-type="replies" data-value="30">30</button>
        <button type="button" class="option-btn" data-type="replies" data-value="50">50</button>
        <button type="button" class="option-btn" data-type="replies" data-value="100">100</button>
        <button type="button" class="option-btn" data-type="replies" data-value="500">500</button>
        <button type="button" class="option-btn clear-btn" data-type="replies" data-value="">Aucun</button>
      </div>
    </div>

    <label>Nombre minimum de re-tweets</label>
    <div class="selector-box">
      <div class="selector-title">Choisir une valeur</div>
      <div class="option-buttons">
        <button type="button" class="option-btn" data-type="retweets" data-value="5">5</button>
        <button type="button" class="option-btn" data-type="retweets" data-value="15">15</button>
        <button type="button" class="option-btn" data-type="retweets" data-value="30">30</button>
        <button type="button" class="option-btn" data-type="retweets" data-value="50">50</button>
        <button type="button" class="option-btn" data-type="retweets" data-value="100">100</button>
        <button type="button" class="option-btn" data-type="retweets" data-value="500">500</button>
        <button type="button" class="option-btn clear-btn active" data-type="retweets" data-value="">Aucun</button>
      </div>
    </div>

    <div class="hint">
      Tu peux choisir soit les réponses, soit les re-tweets. Quand tu sélectionnes l’un, l’autre s’efface.
    </div>

    <label for="startDate">Date de début</label>

    <div class="date-wrapper">
      <button type="button" id="dateDisplay" class="date-display">
        <span id="dateDisplayText"></span>
        <span>📅</span>
      </button>

      <input
        id="startDate"
        class="hidden-date-input"
        type="date"
      />
    </div>

    <div class="date-fr" id="dateFrPreview"></div>

    <label for="liveOnly" class="checkbox-line">
      <input id="liveOnly" type="checkbox" checked />
      Recherche en direct (live)
    </label>

    <button id="openSearch" class="main-button">Ouvrir la recherche sur X</button>

    <div class="link-preview" id="linkPreview"></div>
  </div>

  <script>
    const keywordInput = document.getElementById("keyword");
    const startDateInput = document.getElementById("startDate");
    const dateDisplay = document.getElementById("dateDisplay");
    const dateDisplayText = document.getElementById("dateDisplayText");
    const liveOnlyInput = document.getElementById("liveOnly");
    const linkPreview = document.getElementById("linkPreview");
    const dateFrPreview = document.getElementById("dateFrPreview");
    const openSearchButton = document.getElementById("openSearch");

    let selectedReplies = "30";
    let selectedRetweets = "";

    function getTodayDateIso() {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, "0");
      const day = String(today.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    function formatIsoToFr(dateIso) {
      if (!dateIso) return "";

      const [year, month, day] = dateIso.split("-");
      return `${day}/${month}/${year}`;
    }

    function openNativeDatePicker() {
      if (typeof startDateInput.showPicker === "function") {
        startDateInput.showPicker();
      } else {
        startDateInput.focus();
        startDateInput.click();
      }
    }

    function updateDateDisplay() {
      const isoDate = startDateInput.value || getTodayDateIso();
      const frDate = formatIsoToFr(isoDate);

      dateDisplayText.textContent = frDate;
      dateFrPreview.textContent = `Date choisie : ${frDate}`;
    }

    function updateActiveButtons() {
      document.querySelectorAll('[data-type="replies"]').forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.value === selectedReplies);
      });

      document.querySelectorAll('[data-type="retweets"]').forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.value === selectedRetweets);
      });
    }

    function generateXSearchUrl() {
      const keyword = keywordInput.value.trim();
      const startDateIso = startDateInput.value || getTodayDateIso();
      const isLive = liveOnlyInput.checked;

      const queryParts = [];

      if (keyword) {
        queryParts.push(keyword);
      }

      if (selectedReplies !== "") {
        queryParts.push(`min_replies:${selectedReplies}`);
      } else if (selectedRetweets !== "") {
        queryParts.push(`min_retweets:${selectedRetweets}`);
      }

      queryParts.push(`since:${startDateIso}`);

      let url = `https://x.com/search?q=${encodeURIComponent(queryParts.join(" "))}&src=typed_query`;

      if (isLive) {
        url += "&f=live";
      }

      return url;
    }

    function updatePreview() {
      const url = generateXSearchUrl();
      const frDate = formatIsoToFr(startDateInput.value || getTodayDateIso());

      let filterLabel = "Aucun filtre";

      if (selectedReplies !== "") {
        filterLabel = `Réponses minimum : ${selectedReplies}`;
      } else if (selectedRetweets !== "") {
        filterLabel = `Re-tweets minimum : ${selectedRetweets}`;
      }

      linkPreview.innerHTML = `
        <div><strong>Date :</strong> ${frDate}</div>
        <div><strong>Filtre :</strong> ${filterLabel}</div>
        <div><strong>Mode :</strong> ${liveOnlyInput.checked ? "Live" : "Standard"}</div>
        <div class="url"><strong>Lien :</strong> ${url}</div>
      `;

      updateDateDisplay();
      updateActiveButtons();
    }

    document.querySelectorAll(".option-btn").forEach((button) => {
      button.addEventListener("click", function () {
        const type = this.dataset.type;
        const value = this.dataset.value;

        if (type === "replies") {
          selectedReplies = value;
          selectedRetweets = "";
        }

        if (type === "retweets") {
          selectedRetweets = value;
          selectedReplies = "";
        }

        updatePreview();
      });
    });

    dateDisplay.addEventListener("click", openNativeDatePicker);
    startDateInput.addEventListener("change", updatePreview);
    keywordInput.addEventListener("input", updatePreview);
    liveOnlyInput.addEventListener("change", updatePreview);

    openSearchButton.addEventListener("click", function () {
      window.open(generateXSearchUrl(), "_blank");
    });

    startDateInput.value = getTodayDateIso();
    updatePreview();
  </script>
</body>
</html>
